name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Download Gradle (retries on a slow server)
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --no-daemon --version && exit 0
            [ "$i" -lt 5 ] || break
            echo "Gradle download attempt $i failed; retrying in $((30 * i))s"; sleep $((30 * i))
          done
          exit 1
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
