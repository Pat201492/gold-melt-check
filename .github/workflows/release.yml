name: Release

# Publishing a GitHub Release (tag like v0.1.0) builds a signed APK and attaches it to that release.
# Create the release from the GitHub app or website: Releases -> Draft a new release -> new tag -> Publish.
# Releases don't count against Actions storage, so no artifact is uploaded.
on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GMC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "GMC_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::GMC_KEYSTORE_BASE64 is not set; signing with a throwaway debug key. Each release will need an uninstall before installing."
          fi
      - name: Test and build release APK
        env:
          GMC_KEYSTORE_PASSWORD: ${{ secrets.GMC_KEYSTORE_PASSWORD }}
          GMC_KEY_ALIAS: ${{ secrets.GMC_KEY_ALIAS }}
          GMC_KEY_PASSWORD: ${{ secrets.GMC_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew --no-daemon testDebugUnitTest assembleRelease \
            -PversionName="$VERSION" -PversionCode="${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "gold-melt-check-$VERSION.apk"
      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "gold-melt-check-${GITHUB_REF_NAME#v}.apk" --clobber
