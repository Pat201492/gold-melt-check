name: Release

# Builds a signed APK and attaches it to a GitHub Release. Two ways to start it:
#   - publish a release from the GitHub app or website (tag like v0.1.0), or
#   - push a branch named release/v0.1.0; the workflow then creates the v0.1.0 tag and release itself.
# A release created here uses GITHUB_TOKEN, which doesn't trigger workflows, so there's no second run.
# Releases don't count against Actions storage, so no artifact is uploaded.
on:
  release:
    types: [published]
  push:
    branches: ["release/v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GMC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "GMC_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::GMC_KEYSTORE_BASE64 is not set; signing with a throwaway debug key. Each release will need an uninstall before installing."
          fi
      - name: Bundle a year of gold and silver history
        # Optional: needs a free gold-api.com key saved as the GOLD_API_KEY repo secret. The key is used here,
        # at build time, and never ships in the app. 2 requests per release (free tier allows 10/hour).
        env:
          GOLD_API_KEY: ${{ secrets.GOLD_API_KEY }}
        run: |
          if [ -z "$GOLD_API_KEY" ]; then
            echo "::warning::GOLD_API_KEY is not set; the app will build its history from its own checks."
            exit 0
          fi
          mkdir -p app/src/main/assets
          END=$(date -u +%s); START=$((END - 366*24*3600))
          for SYM in XAU XAG; do
            OUT="app/src/main/assets/history_${SYM}.json"
            if curl -fsS --max-time 60 -H "x-api-key: $GOLD_API_KEY" \
                "https://api.gold-api.com/history?symbol=${SYM}&startTimestamp=${START}&endTimestamp=${END}&groupBy=day&aggregation=avg&orderBy=asc" \
                -o "$OUT" \
              && python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert isinstance(d,list) and len(d)>200, len(d); print(sys.argv[1], len(d), 'days')" "$OUT"; then
              :
            else
              echo "::warning::Could not download ${SYM} history; this release ships without it."
              rm -f "$OUT"
            fi
            sleep 2
          done
      - name: Work out the version
        run: |
          TAG="${GITHUB_REF_NAME#release/}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Test and build release APK
        env:
          GMC_KEYSTORE_PASSWORD: ${{ secrets.GMC_KEYSTORE_PASSWORD }}
          GMC_KEY_ALIAS: ${{ secrets.GMC_KEY_ALIAS }}
          GMC_KEY_PASSWORD: ${{ secrets.GMC_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon testDebugUnitTest assembleRelease \
            -PversionName="$VERSION" -PversionCode="${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "gold-melt-check-$VERSION.apk"
      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="gold-melt-check-$VERSION.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
